<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">WG-ShopSync Kontext</title><desc id="desc">Benutzer nutzt die WG-ShopSync Webanwendung. Die Anwendung kommuniziert mit Firebase Authentication und Cloud Firestore. Einkauf und Zahlung liegen ausserhalb der Systemgrenze.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker><style>.b{fill:#f8fafc;stroke:#344054;stroke-width:2;rx:12}.c{fill:#eef4ff;stroke:#3657a7;stroke-width:2;rx:12}.o{fill:#fff7ed;stroke:#b45309;stroke-width:2;rx:12}.t{font:700 19px Arial;fill:#172b4d}.s{font:14px Arial;fill:#475467}.l{stroke:#344054;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1100" height="520" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="t">A03 Systemkontext</text><rect x="60" y="205" width="190" height="90" class="b"/><text x="155" y="245" text-anchor="middle" class="t">Benutzer</text><text x="155" y="270" text-anchor="middle" class="s">Webbrowser</text><rect x="360" y="175" width="260" height="150" class="b"/><text x="490" y="225" text-anchor="middle" class="t">WG-ShopSync</text><text x="490" y="252" text-anchor="middle" class="s">Responsive Webanwendung</text><text x="490" y="278" text-anchor="middle" class="s">Einkauf und Kostenuebersicht</text><rect x="760" y="100" width="270" height="100" class="c"/><text x="895" y="142" text-anchor="middle" class="t">Firebase Authentication</text><text x="895" y="168" text-anchor="middle" class="s">Konten und Sitzungen</text><rect x="760" y="260" width="270" height="115" class="c"/><text x="895" y="302" text-anchor="middle" class="t">Cloud Firestore</text><text x="895" y="328" text-anchor="middle" class="s">Daten, Realtime, Offline</text><rect x="360" y="410" width="260" height="70" class="o"/><text x="490" y="440" text-anchor="middle" class="t">Ausserhalb</text><text x="490" y="463" text-anchor="middle" class="s">Einkauf und Zahlung</text><line x1="250" y1="250" x2="360" y2="250" class="l"/><line x1="620" y1="220" x2="760" y2="155" class="l"/><line x1="620" y1="285" x2="760" y2="315" class="l"/><line x1="490" y1="325" x2="490" y2="410" class="l"/></svg>