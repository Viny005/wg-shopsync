<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">WG-ShopSync Web architecture components</title>
  <desc id="desc">Browser web UI connects to application services, Firebase Authentication and Cloud Firestore. Firestore provides offline cache and realtime synchronization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054" />
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #344054; stroke-width: 2; rx: 12; }
      .cloud { fill: #eef4ff; stroke: #3657a7; stroke-width: 2; rx: 12; }
      .cache { fill: #f0fdf4; stroke: #28734f; stroke-width: 2; rx: 12; }
      .title { font: 700 24px Arial, sans-serif; fill: #172b4d; }
      .label { font: 700 17px Arial, sans-serif; fill: #172b4d; }
      .small { font: 14px Arial, sans-serif; fill: #475467; }
      .line { stroke: #344054; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="620" fill="#ffffff" />
  <text x="550" y="48" text-anchor="middle" class="title">WG-ShopSync Webarchitektur</text>

  <rect x="55" y="230" width="190" height="105" class="box" />
  <text x="150" y="270" text-anchor="middle" class="label">Benutzer</text>
  <text x="150" y="298" text-anchor="middle" class="small">moderner Webbrowser</text>

  <rect x="330" y="190" width="250" height="185" class="box" />
  <text x="455" y="235" text-anchor="middle" class="label">WG-ShopSync</text>
  <text x="455" y="265" text-anchor="middle" class="small">Web UI</text>
  <text x="455" y="291" text-anchor="middle" class="small">Application Services</text>
  <text x="455" y="317" text-anchor="middle" class="small">Validation and state</text>
  <text x="455" y="343" text-anchor="middle" class="small">Firestore Repository</text>

  <rect x="725" y="125" width="280" height="115" class="cloud" />
  <text x="865" y="168" text-anchor="middle" class="label">Firebase Authentication</text>
  <text x="865" y="198" text-anchor="middle" class="small">registration, login, session</text>

  <rect x="725" y="315" width="280" height="145" class="cloud" />
  <text x="865" y="360" text-anchor="middle" class="label">Cloud Firestore</text>
  <text x="865" y="390" text-anchor="middle" class="small">WG data, realtime listeners</text>
  <text x="865" y="416" text-anchor="middle" class="small">Security Rules</text>

  <rect x="725" y="510" width="280" height="70" class="cache" />
  <text x="865" y="540" text-anchor="middle" class="label">Offline Cache</text>
  <text x="865" y="562" text-anchor="middle" class="small">synced shopping data</text>

  <line x1="245" y1="282" x2="330" y2="282" class="line" />
  <line x1="580" y1="245" x2="725" y2="190" class="line" />
  <line x1="580" y1="325" x2="725" y2="385" class="line" />
  <line x1="865" y1="460" x2="865" y2="510" class="line" />
</svg>
